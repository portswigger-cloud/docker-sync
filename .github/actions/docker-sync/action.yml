name: 'Docker Sync Action'
description: 'Keeps docker images in sync between registries or repositories'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  source:
    description: source image repository
    required: true
  destination:
    description: destination image repository
    required: true
  max-tags:
    description: The maximum number of image tags to sync
    required: false
    default: '10'
  max-errors:
    description: maximimum number of errors to tolerate before failure
    required: false
    default: '5'

runs:
  using: composite
  steps:
  - name: Install regctl
    uses: iarekylew00t/regctl-installer@v1.2
  - name: Sync images
    shell: bash
    run: |
      #!/usr/bin/env bash
      set -ux -o pipefail
      skopeo --version

      VERSIONS="$(skopeo list-tags docker://${{ inputs.source }} | jq -r '.Tags[] | scan("latest|stable|.*[0-9]+\\.[0-9]+\\.[0-9]+.*")' | sort --version-sort | uniq | tail -n ${{ inputs.max-tags }})"

      error_count=0

      echo "${VERSIONS}" | while read version ; do

          if [ "$version" = "" ]; then
              break
          fi
          if [ "$error_count" -gt "${{ inputs.max-errors }}" ]; then
              echo "::error:: Errors copying images from ${{ inputs.source }} exceeded the maximum allowed."
              exit 1
          fi

          if [ "$version" = "latest" ] || [ "$version" = "stable" ]; then
              # Always copy "latest" and "stable"
              regctl image copy \
                  ${{ inputs.source }}:$version \
                  ${{ inputs.destination }}:$version || ((error_count++))
              continue
          fi

          # Only copy if it isn't there already
          skopeo inspect docker://${{ inputs.destination }}:$version >/dev/null 2>&1 || \
          regctl image copy \
              ${{ inputs.source }}:$version \
              ${{ inputs.destination }}:$version || ((error_count++))

      done

