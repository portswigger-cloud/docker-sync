name: 'Docker Sync Action'
description: 'Keeps docker images in sync between registries or repositories'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  source:
    description: source image repository
    required: true
  destination:
    description: destination image repository
    required: true
  max-tags:
    description: The maximum number of image tags to sync
    required: false
    default: '10'

runs:
  using: composite
  steps:
  - name: Install regctl
    uses: iarekylew00t/regctl-installer@v1.2
  - name: Sync images
    shell: bash
    run: |
      set -ux -o pipefail
      skopeo --version

      VERSIONS="$(skopeo list-tags docker://${{ inputs.source }} | jq -r '.Tags[] | scan("latest|stable|.*[0-9]+\\.[0-9]+\\.[0-9].*|[0-9]{4}\\.[0-9]{1,2}")' | sort --version-sort | uniq | tail -n ${{ inputs.max-tags }})"

      echo "${VERSIONS}" | while read version ; do

          if [ "$version" = "" ]; then
              break
          fi

          if [ "$version" = "latest" ] || [ "$version" = "stable" ]; then
              # Check if latest/stable already exists to avoid immutability errors
              if skopeo inspect docker://${{ inputs.destination }}:$version >/dev/null 2>&1; then
                  echo "Tag $version already exists in destination, skipping due to immutability settings"
                  continue
              fi

              # Try to copy, but don't fail if immutability prevents it
              if ! regctl image copy \
                  ${{ inputs.source }}:$version \
                  ${{ inputs.destination }}:$version 2>&1 | tee /tmp/regctl_output.txt; then
                  if grep -q "immutability" /tmp/regctl_output.txt || grep -q "already assigned" /tmp/regctl_output.txt; then
                      echo "Skipping $version: tag is immutable and cannot be overwritten"
                      continue
                  else
                      # Re-throw the error if it's not an immutability issue
                      exit 1
                  fi
              fi
              continue
          fi

          # Only copy if it isn't there already
          skopeo inspect docker://${{ inputs.destination }}:$version >/dev/null 2>&1 || \
          regctl image copy \
              ${{ inputs.source }}:$version \
              ${{ inputs.destination }}:$version

      done

