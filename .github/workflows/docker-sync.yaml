name: Docker Sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 10 * * *"

jobs:
  docker-sync:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        docker-repo:
        - sonatype/nexus3
        - loopingz/smtp-relay
        - tonistiigi/binfmt
        - defectdojo/defectdojo-django
        - defectdojo/defectdojo-nginx
        - returntocorp/semgrep
        - bitnami/node-exporter
        - prom/memcached-exporter
        
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Sync ${{ matrix.docker-repo }} images
        uses: portswigger-cloud/docker-sync/.github/actions/docker-sync@main
        with:
          max-tags: '20'
          source: ${{ matrix.docker-repo }}
          destination: ghcr.io/${{ github.repository_owner }}/${{ matrix.docker-repo }}





