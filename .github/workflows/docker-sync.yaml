name: Docker Sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 10 * * *"

jobs:
  docker-sync:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        docker-repo:
        - sonatype/nexus3
        - loopingz/smtp-relay
        - tonistiigi/binfmt
        - defectdojo/defectdojo-django
        - defectdojo/defectdojo-nginx
        - returntocorp/semgrep
        - bitnami/node-exporter
        - prom/memcached-exporter
        - grafana/loki
        - grafana/mimir
        - grafana/tempo
        - grafana/alloy
        
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: portswigger-tim/safer-runner-action@0d9a798b9ddea4a6b9ab3c4375f8018b191c2e3d # v1.1.2
        with: 
          mode: enforce
          allowed-domains: |
            auth.docker.io
            registry-1.docker.io
          disable-sudo: true
      - name: Sync ${{ matrix.docker-repo }} images
        uses: portswigger-cloud/docker-sync/.github/actions/docker-sync@main
        with:
          max-tags: '20'
          source: ${{ matrix.docker-repo }}
          destination: ghcr.io/${{ github.repository_owner }}/${{ matrix.docker-repo }}





