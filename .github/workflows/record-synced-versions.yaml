name: Record Synced Versions

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: PortSwigger/safer-runner-action@b2208f653b6bf422e08501155f4df82bad008184 # v1.2.2
        with:
          mode: enforce
          allowed-domains: |
            public.ecr.aws
            d2glxqk2uabbnd.cloudfront.net
            d5l0dvt14r5h8.cloudfront.net
            github.com
            api.github.com
            codeload.github.com
            objects.githubusercontent.com
          disable-sudo: true
          disable-docker: true

      - uses: actions/checkout@v4

      - uses: iarekylew00t/regctl-installer@v1.2

      - name: Build synced-versions manifest
        shell: bash
        run: |
          set -euo pipefail
          images=(
            web-server
            enterprise-server
            enterprise-scan-container
            portswigger-hosted-scan
            scan-controller
            relay
          )
          tmp="$(mktemp)"
          printf '{}' > "$tmp"
          for img in "${images[@]}"; do
            tags="$(regctl tag ls "public.ecr.aws/portswigger/$img" \
              | grep -E 'latest|stable|[0-9]+\.[0-9]+\.[0-9]|[0-9]{4}\.[0-9]{1,2}' \
              | sort --version-sort | uniq | tail -n 20 | jq -R . | jq -s 'unique')"
            jq --arg i "$img" --argjson t "$tags" '.[$i] = $t' "$tmp" > "$tmp.next"
            mv "$tmp.next" "$tmp"
          done
          jq -S --arg reg "public.ecr.aws/portswigger" '{source_registry: $reg, images: .}' \
            "$tmp" > synced-versions.json
          cat synced-versions.json

      - name: Commit manifest (or heartbeat)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synced-versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update synced versions manifest [skip ci]"
            git push
            echo "Manifest changed; committed."
          else
            last="$(git log -1 --format=%ct -- synced-versions.json 2>/dev/null || echo 0)"
            now="$(date +%s)"
            age_days=$(( (now - last) / 86400 ))
            if [ "$last" = "0" ] || [ "$age_days" -ge 45 ]; then
              date -u +%FT%TZ > .keepalive
              git add .keepalive
              git commit -m "chore: keepalive heartbeat [skip ci]"
              git push
              echo "No manifest change; heartbeat committed (age ${age_days}d)."
            else
              echo "No change; manifest is ${age_days}d old (<45d), no commit needed."
            fi
          fi
